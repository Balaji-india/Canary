# Defaults for campaigns. See docs/DESIGN.md sections 2, 8, 9 and 12.
mix: {real: 0.50, canary_measure: 0.15, canary_probe: 0.15, control: 0.10, sham: 0.10}
gate: {tau: 0.10, tau_alarm: 0.05, percentile: 90}
control_chart: {window: 20, alarm_rules: ["1 window below 3 sigma", "2 consecutive windows below 2 sigma"]}
monte_carlo_draws: 5000
sandbox_timeout_s: 120
seeds_per_arm: 5
science:
  test_size: 0.25
  alpha: 0.05                # the verdict's confidence interval is 1 - alpha
  min_effect_floor: 0.005    # stops a Scientist calling a trivially small difference a success
  proposal_attempts: 3
  baseline_guard: true       # check each proposal before the lock (canary/baseline_guard.py, B09 at proposal time)
calibrate: {question: q1, grid_rounds: 2, seed: 2404}   # 2 proposals per dataset for the pool of bases to clone
replication: {new_seeds: 5, new_split: true, sibling_dataset: when_available}
graveyard_similarity: 0.75
questions:
  q1: "Which preprocessing and regularization choices help small tabular classifiers?"
  q2: "When does class weighting help on imbalanced tabular data?"
trust:
  # Which (class, tier) variants each population can carry (docs/plans/mission_4_1_trust.md, section 2). A variant
  # is left out only with the rule or test that excludes it written beside it; canary/trust.py refuses anything else.
  support:
    real_guard_off:
      B06 obvious: "tripwire rule L1 (accuracy above a 3:1 class ratio) after the run"
    real_guard_untested:    # today: guard on but not yet tested, so B09 stays in (plan decision 2)
      B06 obvious: "guard rule G0 before the run, tripwire rule L1 after it"
    real_guard_tested:      # only after the guard passes its test (b09_proposal_guard.md step 7); leak term added
      B06 obvious: "guard rule G0 before the run, tripwire rule L1 after it"
      B09 obvious: "guard rules G1-G4 (tested); what it lets through is the measured leak term"
      B09 subtle: "guard rules G1-G4 (tested); what it lets through is the measured leak term"
    hidden_truth: {}        # Mission 4.2: the estimator is not told what was planted
