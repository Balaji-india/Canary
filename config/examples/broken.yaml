# Deliberately broken: passes validation, then crashes inside the sandbox because C must be positive.
# Mission 1.2's check uses it to prove that a crash is recorded rather than lost.
dataset: breast_cancer
metric: f1
seeds: [0, 1]
test_size: 0.25
control:   {model: logistic_regression, params: {C: -1.0, max_iter: 1000}, preprocessing: [standard_scaler]}
treatment: {model: logistic_regression, params: {C: 0.1, max_iter: 1000}, preprocessing: [standard_scaler]}
