[pytest]
# The default run must stay under 30 s (CLAUDE.md section 6). The slowest tests (each about 0.5-4 s: real sandbox
# runs, timeouts, figures, large Monte Carlo) are marked `slow` and left out by default, not deleted.
# Run them with:  pytest -m slow      Run everything with:  pytest -m "slow or not slow"
markers =
    slow: takes about 0.5 s or more; left out of the default run, run with `pytest -m slow`
addopts = -m "not slow"
