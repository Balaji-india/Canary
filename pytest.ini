[pytest]
# The default run must stay under 30 s (CLAUDE.md section 6). The slowest tests (real sandbox runs, replays, timeouts,
# figures, large Monte Carlo; since 2026-11-14 also a few secondary checks of 0.2-0.4 s, to make room for Mission 5.1)
# are marked `slow` and left out by default, not deleted.
# Run them with:  pytest -m slow      Run everything with:  pytest -m "slow or not slow"
markers =
    slow: takes about 0.2 s or more; left out of the default run, run with `pytest -m slow`
addopts = -m "not slow"
